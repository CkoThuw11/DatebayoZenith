lowercaseOutputName: true
lowercaseOutputLabelNames: true

rules:
  # MilliSecondsBehindSource — WAL lag per connector
  - pattern: 'debezium\.postgres<type=connector-metrics, context=streaming, server=([^,]+)><>MilliSecondsBehindSource'
    name: debezium_metrics_millisecondsbehindource
    labels:
      connector: "$1"
    type: GAUGE

  # TotalNumberOfEventsSeen — cumulative events processed
  - pattern: 'debezium\.postgres<type=connector-metrics, context=streaming, server=([^,]+)><>TotalNumberOfEventsSeen'
    name: debezium_metrics_totalnumberofeventsseen_total
    labels:
      connector: "$1"
    type: COUNTER

  # ConnectedStatus — is the connector connected to Postgres?
  - pattern: 'debezium\.postgres<type=connector-metrics, context=streaming, server=([^,]+)><>Connected'
    name: debezium_metrics_connected
    labels:
      connector: "$1"
    type: GAUGE