apiVersion: 1

contactPoints:
  - orgId: 1
    name: PagerDuty CDC Alerts
    receivers:
      - uid: pagerduty-cdc-receiver
        type: pagerduty
        settings:
          integrationKey: "${PAGERDUTY_ROUTING_KEY}"
          url: "https://events.eu.pagerduty.com/v2/enqueue"
        disableResolveMessage: false

# ─── Notification Policies ────────────────────────────────────────────────────
policies:
  - orgId: 1
    receiver: PagerDuty CDC Alerts
    group_by:
      - alertname
      - table
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: CDC Infrastructure
    folder: CDC Monitoring
    interval: 1m
    rules:

      # ── Rule 1: Kafka Consumer Lag > 1000 ────────────────────────────────
      - uid: cdc-kafka-lag-alert
        title: "CDC Kafka Consumer Lag Too High"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus-ds
            model:
              expr: sum by (topic) (kafka_consumergroup_lag{consumergroup="connect-minio-s3-sink-connector"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              expression: A
              hide: false
              reducer: max
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator: { params: [1000], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              expression: B
              hide: false
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "[CDC Kafka] S3 Sink consumer lag is {{ $values.B.Value | humanize }} messages (threshold: 1000) — bronze writes are stalling"
          description: |
            component: kafka/s3-sink-connector
            consumer_group: connect-minio-s3-sink-connector

            lag_messages: {{ $values.B.Value }}
            threshold: 1000
            affected_topics: orders, order_details, products

            dashboard_url: "http://localhost:3000/d/cdc-pipeline?viewPanel=2"
            steps: |
              1. Check S3 Sink connector status:
                 curl http://localhost:8083/connectors/minio-s3-sink-connector/status
              2. Check Kafka Connect logs:
                 docker logs kafka-connect --tail 100
              3. If connector is FAILED, restart it:
                 curl -X POST http://localhost:8083/connectors/minio-s3-sink-connector/restart
          runbook_url: "http://localhost:3000/d/cdc-pipeline?viewPanel=2"
        labels:
          severity: critical
          component: kafka
          group: data-engineering
          pipeline: northwind-cdc
        isPaused: false

      # ── Rule 2: Spark not running > 10 minutes ────────────────────────────
      - uid: cdc-spark-stale-alert
        title: "CDC Spark Processor Not Running"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus-ds
            model:
              expr: time() - cdc_last_run_timestamp_seconds
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              expression: A
              hide: false
              reducer: max
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator: { params: [600], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              expression: B
              hide: false
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          # What is the problem?
          summary: "[CDC Spark] Processor has not run for {{ $values.B.Value | humanizeDuration }} (threshold: 10 min) — bronze writes are stopped"
          description: |
            # Where does it belong?
            component: spark/cdc-processor
            container: spark-cdc

            # What is the proof?
            silence_duration: {{ $values.B.Value | humanizeDuration }}
            threshold: 10 minutes
            metric: cdc_last_run_timestamp_seconds (no update received)

            # What do I do next?
            dashboard_url: "http://localhost:3000/d/cdc-pipeline?viewPanel=4"
            steps: |
              1. Check if the container is still running:
                 docker ps | grep spark-cdc
              2. Check container logs for crash or OOM:
                 docker logs spark-cdc --tail 100
              3. Restart if crashed:
                 docker compose restart spark-cdc
              4. If restarted, verify metrics resume within 2 minutes:
                 curl -s pushgateway:9091/metrics | grep cdc_last_run
          runbook_url: "http://localhost:3000/d/cdc-pipeline?viewPanel=4"
        labels:
          severity: critical
          component: spark
          group: infrastructure
          pipeline: northwind-cdc
        isPaused: false