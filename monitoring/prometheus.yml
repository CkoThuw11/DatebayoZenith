global:
  scrape_interval: 15s

scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: debezium
    static_configs:
      - targets: ['kafka-connect:7071']